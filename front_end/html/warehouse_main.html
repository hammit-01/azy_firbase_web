<!DOCTYPE html>
<html lang="ko">
<!-- firebase web service upload = /css/...
 pytjon service upload = /css/... -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="./css/warehouse_main.css">
    <title>에이젯유통 재고장</title>
</head>

<body>
    <div class="container">

        <!-- ── 고정 헤더 (툴바 + 패널) ── -->
        <div class="sticky-header">
        <div class="toolbar">
            <div class="toolbar-section">
                <div class="toolbar-left">
                    <a href="/main.html" class="logo-link" title="메인으로">
                        <h1>재고장</h1>
                    </a>
                    <div class="table_size"></div>
                </div>
                <div class="toolbar-right">
                    <div class="toolbar-row">
                        <select class="show-product-name filter-sel">
                            <option value="">상품명</option>
                            <!-- 실제 옵션은 현재 데이터 기준으로 js/table.js의 renderProductNameOptions()가 가나다순으로 채움 -->
                        </select>
                        <select class="show-brand filter-sel">
                            <option value="">브랜드</option>
                            <!-- 실제 옵션은 현재 데이터 기준으로 js/table.js의 renderBrandOptions()가 가나다순으로 채움 -->
                        </select>
                        <input id="searchInput" class="search-input" placeholder="검색1">
                    </div>
                    <div class="toolbar-row">
                        <select class="show-warehouse filter-sel">
                            <option value="">창고</option>
                            <!-- 실제 옵션은 현재 크롤링된 데이터 기준으로 js/table.js의 renderWarehouseOptions()가 가나다순으로 채움 -->
                        </select>
                        <select class="show-state filter-sel">
                            <option value="">상태</option>
                            <option value="holding">예약</option>
                            <option value="freeze">동결</option>
                            <option value="stopped">사용불가</option>
                            <option value="moving">이고</option>
                            <option value="특이품">특이품</option>
                            <option value="null">null(정보누락)</option>
                        </select>
                        <input id="searchInput2" class="search-input" placeholder="검색2">
                    </div>
                </div>
            </div>
            <div class="toolbar-login">
                <button class="login-btn">
                    <span class="login-icon">👤</span>
                    <span class="login-btn-text">로그인</span>
                </button>

                <div class="login-popover">
                    <div class="login-form">
                        <label class="login-field">
                            <span class="login-label">아이디</span>
                            <input type="text" id="loginIdInput" class="login-input" placeholder="아이디(사번)" autocomplete="username">
                        </label>
                        <label class="login-field">
                            <span class="login-label">비밀번호</span>
                            <input type="password" id="loginPwInput" class="login-input" placeholder="비밀번호" autocomplete="current-password" maxlength="4">
                        </label>
                        <div class="login-error"></div>
                        <button class="login-submit-btn">로그인</button>
                    </div>
                    <div class="login-profile" style="display:none">
                        <div class="login-profile-name"></div>
                        <div class="login-profile-role"></div>
                        <button class="logout-btn">로그아웃</button>
                    </div>
                </div>

                <span class="table_size_updated"></span>
                <div id="bulk-action-bar" class="bulk-action-bar"></div>

                <div class="toolbar-row toolbar-row-actions">
                    <!-- CRUD 버튼 -->
                    <button class="insert-btn">추가</button>
                    <button class="update-btn">수정</button>
                    <button class="holding-btn">예약</button>

                    <div class="tb-sep"></div>

                    <!-- 유틸 버튼 -->
                    <button class="rollback-btn">되돌리기</button>
                    <button class="clear-btn" data-action="clear-selection">전체 취소</button>
                    <button class="all-delete-btn">전체 삭제</button>
                    <button class="reservations-tab-btn">예약 현황</button>
                    <button class="changes-tab-btn">업데이트</button>
                    <button class="main-download-btn">엑셀 다운로드</button>
                </div>
            </div>
        </div>
        </div><!-- /.sticky-header -->

        <button id="toggle-sticky-header-btn" class="toggle-sticky-header-btn" title="상단 고정 영역 숨기기/보이기">▲</button>
        <button id="toggle-desktop-view-btn" class="toggle-desktop-view-btn" title="PC 화면으로 보기">PC</button>

        <!-- ── 테이블 ── -->
        <div class="table-container">
        <div class="left-panel">
            <div id="mobile-list" class="mobile-list"></div>
            <div class="table-wrap">
                <table>
                    <!-- 각 열 너비는 실제 값 길이 기준으로 배분(2026-08-13, 90% 배율 기준 확인).
                         BL이 "ONEYRICFPX299900"처럼 13~20자로 가장 길어서 가장 넓게 잡음 —
                         이전엔 11%라 nth-child(6) 말줄임(ellipsis) 규칙에 자주 걸려 잘려 보였음.
                         전체 합 100%(이전엔 102%로 안 맞았음). -->
                    <colgroup>
                        <col style="width:5%">  <!--선택-->
                        <col style="width:12%"> <!--상품명-->
                        <col style="width:9%">  <!--브랜드-->
                        <col style="width:5%">  <!--등급-->
                        <col style="width:7%">  <!--ESTNO-->
                        <col style="width:17%"> <!--BL번호-->
                        <col style="width:8%">  <!--창고-->
                        <col style="width:4%">  <!--재고(실재고)-->
                        <col style="width:4%">  <!--예약-->
                        <col style="width:4%">  <!--가용-->
                        <col style="width:9%">  <!--유통기한-->
                        <col style="width:4%">  <!--평균-->
                        <col style="width:12%"> <!--비고-->
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="select-all">선택</th>
                            <th data-key="상품명" class="sortable">상품명</th>
                            <th data-key="브랜드" class="sortable">브랜드</th>
                            <th data-key="등급" class="sortable">등급</th>
                            <th data-key="ESTNO" class="sortable">ESTNO</th>
                            <th data-key="BL" class="sortable">BL</th>
                            <th data-key="창고" class="sortable">창고</th>
                            <th data-key="재고" class="sortable">재고</th>
                            <th data-key="예약수량" class="sortable">예약</th>
                            <th data-key="가용재고" class="sortable">가용</th>
                            <th data-key="유통기한" class="sortable">유통기한</th>
                            <th data-key="평중" class="sortable">평균</th>
                            <th data-key="메모" class="sortable">비고</th>
                        </tr>
                    </thead>
                    <tbody id="insert-rows"></tbody>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
        </div><!-- /.table-container -->

        <!-- ── 변경사항 탭 ── -->
        <div class="changes-container" style="display:none">
            <div id="changes-list"></div>
        </div>

        <!-- ── 예약 현황 탭 (편집자: 담당자별 전체 / 사원: 본인 예약만) ── -->
        <div class="reservations-container" style="display:none">
            <div id="reservations-list"></div>
        </div>

    </div>

    <script type="module" src="./warehouse_main.js"></script>
</body>

</html>
